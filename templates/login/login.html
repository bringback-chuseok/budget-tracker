<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인</title>
  <style>
    :root{
      --bg:#f6f7f9;
      --card:#fff;
      --txt:#111;
      --sub:#666;
      --line:#e5e7eb;
      --primary:#111;          /* 무신사 톤(짙은 블랙 버튼) */
      --focus:#2d6cdf;
      --kakao:#FEE500;
    }
    *{box-sizing:border-box}
    body{
      margin:0; background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      color:var(--txt);
      display:flex; min-height:100vh; align-items:center; justify-content:center;
    }
    .wrap{width:100%; max-width:420px; padding:24px;}
    .brand{
      text-align:center; margin-bottom:18px; color:#111; font-weight:700; letter-spacing:0.5px;
    }
    .card{
      background:var(--card); border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.06);
      padding:28px;
    }
    h1{
      margin:0 0 6px; font-size:22px; letter-spacing:-.2px;
    }
    .sub{
      margin:0 0 18px; font-size:12px; color:var(--sub);
    }
    .field{ margin-bottom:12px; }
    .visually-hidden{ position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap; }
    .input{
      width:100%; height:44px; padding:0 12px; font-size:14px;
      border:1px solid #d9d9df; border-radius:8px; background:#fff;
    }
    .input:focus{ outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(45,108,223,.15); }
    .row-between{
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin:8px 0 16px;
      font-size:12px;
    }
    .muted-link, .muted-link:visited{ color:var(--sub); text-decoration:none; }
    .muted-link:hover{ text-decoration:underline; }
    .checkbox{ display:flex; align-items:center; gap:8px; color:#333; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      width:100%; height:46px; border:1px solid #000; border-radius:8px; cursor:pointer;
      font-size:15px; font-weight:600; transition:transform .04s ease;
    }
    .btn:active{ transform:translateY(1px); }
    .btn-primary{
      background:var(--primary); color:#fff; border-color:#000;
    }
    .sep{ display:flex; align-items:center; gap:12px; margin:18px 0; color:#777; font-size:12px; }
    .sep::before, .sep::after{ content:""; height:1px; background:var(--line); flex:1; }
    .social{ display:flex; flex-direction:column; gap:10px; }
    .btn-kakao{
      background:var(--kakao); color:#111; border-color:#e5c700;
    }
    .btn-google{
      background:#fff; color:#222; border-color:#d9d9df;
    }
    /* Google 버튼은 GIS가 스타일을 가집니다. 부모는 크기만 관리 */
    .g-wrap{
      width:100%;
      border:0.5px solid #d9d9df;       /* 기존 구글 버튼 테두리 색 */
      border-radius:8px;
      background:#fff;
      display:flex;
      align-items:center;             /* GIS 기본 높이(40px)를 수직 중앙 정렬 */
      justify-content:center;
      overflow:hidden;                /* 혹시 내부가 넘치면 잘라냄 */
    }


    /* GIS가 만드는 내부 래퍼/iframe을 컨테이너 폭에 맞춤 */
    #g-button > div,
    #g-button iframe { width:100% !important; }

    .helper{
      margin-top:16px; text-align:center; font-size:12px; color:var(--sub);
    }
    .helper a{ color:#111; text-decoration:none; font-weight:600; }
    .helper a:hover{ text-decoration:underline; }
    .msg{ margin-top:12px; font-size:13px; color:#d32f2f; min-height:18px; }
    .notice{
      margin-top:10px; font-size:11px; color:#8a8a8a; line-height:1.5;
    }
    /* Google 버튼 컨테이너(버튼 렌더 전 기본틀) */
    #g-button{ width:100%; }
  </style>

  <script>
    // CSRF helper (reads from hidden input rendered by Django template)
    function getCsrfToken() {
      const el = document.querySelector('input[name="csrfmiddlewaretoken"]');
      return el ? el.value : '';
    }

    async function loginWithPassword(ev) {
      ev.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const keep = document.getElementById('keep-signed-in').checked;
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const res = await fetch("{{ api_base }}/login/", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken(),
          },
          credentials: 'include',
          body: JSON.stringify({ username, password, keep })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || '로그인 실패');
        msg.style.color = '#2e7d32';
        msg.textContent = data.detail || '로그인 성공';
        // location.href = data.redirect || '/';
      } catch (e) {
        msg.style.color = '#d32f2f';
        msg.textContent = e.message || '로그인 중 오류가 발생했습니다.';
      }
    }

    async function socialLogin(provider, token) {
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const res = await fetch("{{ api_base }}/login/social/", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken(),
          },
          credentials: 'include',
          body: JSON.stringify({ provider, token })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || '소셜 로그인 실패');
        msg.style.color = '#2e7d32';
        msg.textContent = data.detail || '소셜 로그인 성공';
        // location.href = data.redirect || '/';
      } catch (e) {
        msg.style.color = '#d32f2f';
        msg.textContent = e.message || '소셜 로그인 중 오류가 발생했습니다.';
      }
    }

    // Kakao SDK flow
    function handleKakaoLogin() {
      if (!window.Kakao) {
        alert('Kakao SDK 로드에 실패했습니다.');
        return;
      }
      if (!window.Kakao.isInitialized()) {
        window.Kakao.init("{{ kakao_js_key }}");
      }
      window.Kakao.Auth.login({
        scope: 'account_email, profile_nickname',
        success: function(authObj) {
          const accessToken = authObj.access_token;
          socialLogin('kakao', accessToken);
        },
        fail: function(err) {
          const msg = document.getElementById('msg');
          msg.style.color = '#d32f2f';
          msg.textContent = '카카오 로그인 실패: ' + (err.error_description || JSON.stringify(err));
        }
      });
    }

    // Google Identity Services flow
    function initGoogle() {
      if (!window.google || !google.accounts || !google.accounts.id) return;
      google.accounts.id.initialize({
        client_id: "{{ google_client_id }}",
        callback: (response) => {
          const idToken = response.credential;
          if (idToken) socialLogin('google', idToken);
        },
        ux_mode: "popup" // 무신사와 유사한 팝업 흐름
      });
      const container = document.getElementById('g-button');
      if (container) {
        google.accounts.id.renderButton(container, {
          theme: 'outline',
          size: 'large',
          width: 360,
          text: 'continue_with', // "Google로 계속"
          shape: 'rectangular'
        });
      }
    }
    window.addEventListener('DOMContentLoaded', () => {});
  </script>
</head>
<body>
  <div class="wrap">
    <div class="brand" aria-label="서비스 로고">LOGO</div>

    <div class="card" role="main" aria-labelledby="login-title">
      <h1 id="login-title">로그인</h1>
      <p class="sub">이메일(아이디)과 비밀번호를 입력해 주세요.</p>

      <form id="pw-form" onsubmit="loginWithPassword(event)">

        <div class="field">
          <label class="visually-hidden" for="username">아이디</label>
          <input id="username" name="username" type="text" class="input" placeholder="아이디(이메일)" autocomplete="username" required />
        </div>
        <div class="field">
          <label class="visually-hidden" for="password">비밀번호</label>
          <input id="password" name="password" type="password" class="input" placeholder="비밀번호" autocomplete="current-password" required />
        </div>

        <div class="row-between">
          <label class="checkbox">
            <input id="keep-signed-in" type="checkbox" />
            <span>로그인 상태 유지</span>
          </label>
          <div>
            <a class="muted-link" href="/accounts/find-id/">아이디 찾기</a>
            <span style="margin:0 6px;color:#dadde3;">|</span>
            <a class="muted-link" href="/accounts/reset-password/">비밀번호 재설정</a>
          </div>
        </div>

        <button class="btn btn-primary" type="submit">로그인</button>
      </form>

      <div class="sep">간편 로그인</div>

      <div class="social">
        <!-- Kakao -->
        <button type="button" class="btn btn-kakao" onclick="handleKakaoLogin()" aria-label="카카오로 계속하기">
          <!-- Kakao SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3C6.477 3 2 6.477 2 10.773c0 2.89 2.06 5.399 5.098 6.79-.173.648-.626 2.347-.717 2.71-.112.448.163.442.342.321.14-.095 2.215-1.52 3.112-2.136.715.102 1.451.158 2.165.158 5.523 0 10-3.477 10-7.843C22 6.477 17.523 3 12 3z" fill="#000"/>
          </svg>
          카카오로 계속하기
        </button>

        <!-- Google (GIS가 실제 버튼을 렌더) -->

          <div class="g-wrap">
            <div id="g-button" aria-label="Google로 계속하기"></div>
          </div>
      </div>

      <div class="helper">
        아직 회원이 아니신가요? <a href="/users/signup/">회원가입</a>
      </div>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <div class="notice">
        소셜 로그인 시 서비스 이용을 위한 이메일, 프로필 정보가 제공될 수 있습니다.
      </div>
    </div>
  </div>

  <!-- Kakao SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
