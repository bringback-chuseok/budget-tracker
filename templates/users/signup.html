<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>회원가입</title>
  <style>
    :root{
      --bg:#f6f7f9; --card:#fff; --txt:#111; --sub:#666; --line:#e5e7eb; --primary:#111; --focus:#2d6cdf;
    }
    *{box-sizing:border-box}
    body{margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif; color:var(--txt); display:flex; min-height:100vh; align-items:center; justify-content:center;}
    .wrap{width:100%; max-width:520px; padding:24px;}
    .brand{text-align:center; margin-bottom:18px; color:#111; font-weight:700; letter-spacing:0.5px;}
    .card{background:var(--card); border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,.06); padding:28px;}
    h1{margin:0 0 6px; font-size:22px; letter-spacing:-.2px;}
    .sub{margin:0 0 18px; font-size:12px; color:var(--sub);}
    .field{ margin-bottom:12px; }
    .visually-hidden{ position:absolute !important; height:1px; width:1px; overflow:hidden; clip:rect(1px,1px,1px,1px); white-space:nowrap; }
    .input{ width:100%; height:44px; padding:0 12px; font-size:14px; border:1px solid #d9d9df; border-radius:8px; background:#fff; }
    .input:focus{ outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(45,108,223,.15); }
    .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; height:46px; border:1px solid #000; border-radius:8px; cursor:pointer; font-size:15px; font-weight:600; transition:transform .04s ease; }
    .btn:active{ transform:translateY(1px); }
    .btn-primary{ background:var(--primary); color:#fff; border-color:#000; }
    .row{ display:flex; gap:10px; }
    .msg{ margin-top:12px; font-size:13px; color:#d32f2f; min-height:18px; }
    .helper{ margin-top:16px; text-align:center; font-size:12px; color:var(--sub); }
    .helper a{ color:#111; text-decoration:none; font-weight:600; }
    .helper a:hover{ text-decoration:underline; }
  </style>
  <script>
    function getCsrfToken(){ const el=document.querySelector('input[name="csrfmiddlewaretoken"]'); return el?el.value:''; }
    async function signup(ev){
      ev.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value.trim();
      const nickname = document.getElementById('nickname').value.trim();
      const phone_number = document.getElementById('phone_number').value.trim();
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try{
        const res = await fetch('/api/auth/signup/', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'X-CSRFToken': getCsrfToken() },
          credentials:'include',
          body: JSON.stringify({ email, password, name, nickname, phone_number })
        });
        const data = await res.json().catch(()=>({}));
        if(!res.ok) throw new Error((data && (data.detail || Object.values(data)[0])) || '가입 실패');
        msg.style.color = '#2e7d32';
        msg.textContent = '가입이 완료되었습니다. 자동 로그인 토큰이 발급되었습니다.';
        // Optional: 토큰을 저장하거나 다음 페이지로 이동 가능
        // console.log('access', data.access); console.log('refresh', data.refresh);
      }catch(e){
        msg.style.color = '#d32f2f';
        msg.textContent = e.message || '회원가입 처리 중 오류가 발생했습니다.';
      }
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="brand" aria-label="서비스 로고">LOGO</div>
    <div class="card" role="main" aria-labelledby="signup-title">
      <h1 id="signup-title">회원가입</h1>
      <p class="sub">필수 정보를 입력해 주세요.</p>
      <form id="signup-form" onsubmit="signup(event)">
        {% csrf_token %}
        <div class="field">
          <label class="visually-hidden" for="email">이메일</label>
          <input id="email" name="email" type="email" class="input" placeholder="이메일" autocomplete="email" required />
        </div>
        <div class="field">
          <label class="visually-hidden" for="password">비밀번호</label>
          <input id="password" name="password" type="password" class="input" placeholder="비밀번호" autocomplete="new-password" required />
        </div>
        <div class="row">
          <div class="field" style="flex:1">
            <label class="visually-hidden" for="name">이름</label>
            <input id="name" name="name" type="text" class="input" placeholder="이름" maxlength="50" required />
          </div>
          <div class="field" style="flex:1">
            <label class="visually-hidden" for="nickname">닉네임</label>
            <input id="nickname" name="nickname" type="text" class="input" placeholder="닉네임" maxlength="20" required />
          </div>
        </div>
        <div class="field">
          <label class="visually-hidden" for="phone_number">전화번호(선택)</label>
          <input id="phone_number" name="phone_number" type="text" class="input" placeholder="전화번호(선택)" maxlength="20" />
        </div>
        <button class="btn btn-primary" type="submit">회원가입</button>
      </form>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <div class="helper">이미 계정이 있으신가요? <a href="/login/">로그인</a></div>
    </div>
  </div>
</body>
</html>
